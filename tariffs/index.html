<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Места на Бали из сохранённых рилсов: карта, фото и маршруты.">
  <title>Бали — места из рилсов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌴%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/leaflet.js"></script>
  <script defer src="vendor/leaflet.markercluster.js"></script>
  <script defer src="tariff-preview.js"></script>
  <script defer src="i18n.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <h1><a href="./">Бали</a></h1>
    <nav aria-label="Подборка и загрузки">
      <a href="../downloads/Bali-places.html" target="_blank" rel="noopener">Подборка</a>
      <a href="../downloads/Bali-places.pdf" download>PDF</a>
      <a id="language" href="?lang=en" hreflang="en" lang="en" aria-label="Switch to English">EN</a>
    </nav>
  </header>
  <main>
    <aside class="sidebar" aria-label="Поиск и места">
      <section class="filters" aria-label="Фильтры мест">
        <div class="search-row">
          <input id="search" type="search" placeholder="Поиск" aria-label="Поиск по названию и описанию" autocomplete="off">
          <button id="similar-close" type="button" hidden><span aria-hidden="true">×</span> Сбросить похожие</button>
        </div>
        <details id="filter-drawer" class="filter-drawer">
          <summary><span id="filter-label">Фильтры</span><span id="count" role="status" aria-live="polite">Загрузка…</span></summary>
          <div class="filter-options">
            <div class="selects">
              <label>Район<select id="area"><option value="">Все районы</option></select></label>
              <label>Категория<select id="category"><option value="">Все категории</option></select></label>
              <label>Отметки<select id="mark"><option value="">Все отметки</option><option value="want">Хочу сходить</option><option value="been">Уже был</option></select></label>
              <label id="sort-option">Порядок<select id="sort"><option value="">По районам</option><option value="near">Ближе ко мне</option></select></label>
            </div>
            <div class="filter-actions"><button id="reset" type="button">Сбросить всё</button><button id="filters-done" type="button">Показать места</button></div>
          </div>
        </details>
      </section>
      <section id="similar-panel" class="similar-panel" aria-label="Подбор похожих мест" hidden>
        <div class="similar-title"><strong>Похожие на «<span id="similar-name"></span>»</strong></div>
        <div id="similar-focus" class="similar-focus" role="group" aria-label="По каким признакам искать похожее">
          <button type="button" data-focus="all" aria-pressed="true">Всё</button>
          <button type="button" data-focus="cuisine" aria-pressed="false">Кухня</button>
          <button type="button" data-focus="atmosphere" aria-pressed="false">Атмосфера</button>
          <button type="button" data-focus="format" aria-pressed="false">Формат</button>
        </div>
        <p>Сначала тот же формат заведения, затем кухня и атмосфера</p>
      </section>
      <div id="cards" class="cards" aria-label="Найденные места"></div>
      <footer><span id="updated"></span> · <a href="../downloads/Bali-places-map.kml" download>KML</a></footer>
    </aside>
    <section id="map-panel" class="map-panel" aria-label="Карта мест Бали">
      <div id="map"></div>
      <button id="locate" type="button" aria-label="Моё местоположение" title="Моё местоположение"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></svg></button>
      <p id="location-status" class="map-status" role="status" hidden></p>
      <p id="map-status" class="map-status" role="status" hidden></p>
    </section>
  </main>
  <div class="view-switch" role="group" aria-label="Режим просмотра"><button id="list-view" class="active" aria-pressed="true" type="button">Список</button><button id="map-view" aria-pressed="false" type="button">Карта</button></div>
  <noscript><p>Для карты нужен JavaScript. <a href="../downloads/Bali-places.html">Открыть подборку с фото</a>.</p></noscript>
</body>
</html>
